name: Kasiva
options:
  bundleIdPrefix: com.clonical
  deploymentTarget:
    iOS: '15.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Kasiva:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: GoogleService-Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kasiva
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Buka Kasiva menggunakan Face ID untuk menjaga privasi keuangan Anda.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clonical.kasiva
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: $(inherited) -ObjC
    scheme:
      gatherCoverageData: false
