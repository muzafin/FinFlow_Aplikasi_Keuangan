name: finflow
description: "FinFlow - Aplikasi Manajemen Keuangan Pribadi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI & Charts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  fpdart: ^1.1.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  path_provider: ^2.1.5

  # Auth
  google_sign_in: ^6.2.2

  # Network
  connectivity_plus: ^6.1.4
  share_plus: ^13.1.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  local_auth: ^3.0.1
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
